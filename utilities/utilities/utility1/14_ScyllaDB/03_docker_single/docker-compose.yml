# ScyllaDB — Docker Compose single-node. Data is a HOST BIND MOUNT (survives `down -v`).
# CQL on :9042, no auth by default (CQL database — interact via cqlsh/nodetool; no browser UI).
# developer-mode + capped smp/memory so it runs on a shared box without the invasive scylla_setup host tuning.
services:
  scylla:
    image: ${SCYLLA_IMAGE:-scylladb/scylla:2026.1}
    container_name: dokandar_scylla_docker_single
    restart: always
    command: ["--developer-mode", "1", "--smp", "1", "--memory", "1G", "--overprovisioned", "1", "--cluster-name", "${SCYLLA_CLUSTER_NAME:-dokandar}"]
    ports:
      - "${SCYLLA_CQL_PORT:-9042}:9042"
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data}/scylla_docker
        target: /var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
