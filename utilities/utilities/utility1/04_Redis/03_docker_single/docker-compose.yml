# DOKANDAR utility — Redis 8 · Docker Compose single-node.
# Auth ON (requirepass). Data is a HOST BIND MOUNT (${DATA_ROOT}/redis_docker) with AOF persistence →
# it SURVIVES `docker compose down -v` (only `setup.sh purge` deletes it).
name: dokandar_redis_single
services:
  redis:
    image: redis:${REDIS_VERSION:-8}
    container_name: dokandar_redis_docker_single
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --dir
      - /data
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (or run setup.sh up)}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    environment:
      - REDIS_HC_PASS=${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data}/redis_docker
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_HC_PASS\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [dokandar_redis_net]
networks:
  dokandar_redis_net:
    name: dokandar_redis_net
