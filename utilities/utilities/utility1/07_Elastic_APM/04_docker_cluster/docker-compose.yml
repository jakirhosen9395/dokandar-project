# DOKANDAR utility — Elastic APM 9.4 · Docker Compose HA · INTEGRATED STACK with APM Server replicas.
# Elasticsearch (storage) + TWO stateless APM Server replicas (apm-1 :8200, apm-2 :8201) + Kibana. APM
# Server holds no state, so its HA is horizontal replicas — both write to the same ES. (For a fully HA
# backend, point them at a multi-node Elasticsearch — see ../03_Elasticsearch/04_docker_cluster.)
name: dokandar_apm_cluster

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.4.2}
    container_name: dokandar_apm_es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?run setup.sh up}
      - ES_JAVA_OPTS=-Xms${ES_JAVA_HEAP:-512m} -Xmx${ES_JAVA_HEAP:-512m}
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    ports:
      - "${ES_HTTP_PORT:-9200}:9200"
    volumes:
      - { type: bind, source: "${DATA_ROOT:-/data}/apm_stack/es", target: /usr/share/elasticsearch/data, bind: { create_host_path: true } }
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks: [dokandar_apm_cluster_net]

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.4.2}
    container_name: dokandar_apm_kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?run setup.sh up}
      - SERVER_PUBLICBASEURL=http://localhost:${KIBANA_PORT:-5601}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 60s
    networks: [dokandar_apm_cluster_net]

  apm-1:
    image: docker.elastic.co/apm/apm-server:${ELASTIC_VERSION:-9.4.2}
    container_name: dokandar_apm_1
    restart: always
    command: >
      -e
        -E apm-server.host=0.0.0.0:8200
        -E apm-server.auth.secret_token=${APM_SECRET_TOKEN:?run setup.sh up}
        -E output.elasticsearch.hosts=["http://elasticsearch:9200"]
        -E output.elasticsearch.username=elastic
        -E output.elasticsearch.password=${ELASTIC_PASSWORD}
    ports:
      - "${APM_PORT:-8200}:8200"
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [dokandar_apm_cluster_net]

  apm-2:
    image: docker.elastic.co/apm/apm-server:${ELASTIC_VERSION:-9.4.2}
    container_name: dokandar_apm_2
    restart: always
    command: >
      -e
        -E apm-server.host=0.0.0.0:8200
        -E apm-server.auth.secret_token=${APM_SECRET_TOKEN}
        -E output.elasticsearch.hosts=["http://elasticsearch:9200"]
        -E output.elasticsearch.username=elastic
        -E output.elasticsearch.password=${ELASTIC_PASSWORD}
    ports:
      - "${APM_PORT2:-8201}:8200"
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [dokandar_apm_cluster_net]

networks:
  dokandar_apm_cluster_net:
    name: dokandar_apm_cluster_net
