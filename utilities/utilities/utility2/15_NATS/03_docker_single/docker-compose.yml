# NATS JetStream — Docker Compose single-node. JetStream store is a HOST BIND MOUNT (survives `down -v`).
# Token auth from .env (setup.sh writes it). :8222 serves JSON monitoring (no HTML UI).
services:
  nats:
    image: ${NATS_IMAGE:-nats:2.14}
    container_name: dokandar_nats_docker_single
    restart: always
    command: ["-js", "-sd", "/data", "-m", "8222", "--auth", "${NATS_AUTH_TOKEN:?set in .env}", "--name", "dokandar-nats-1"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data}/nats_docker
        target: /data
