# DOKANDAR utility — Elasticsearch 9.4 · Docker Compose single-node.
# Security ON (built-in `elastic` user), HTTP basic auth over plain HTTP (single-node: transport TLS off).
# Data is a HOST BIND MOUNT (${DATA_ROOT}/elasticsearch_docker) → survives `docker compose down -v`.
name: dokandar_es_single
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_IMAGE_TAG:-9.4.2}
    container_name: dokandar_es_docker_single
    restart: always
    environment:
      - discovery.type=single-node
      - cluster.name=${ES_CLUSTER_NAME:-dokandar}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env (or run setup.sh up)}
      - ES_JAVA_OPTS=-Xms${ES_JAVA_HEAP:-512m} -Xmx${ES_JAVA_HEAP:-512m}
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${ES_HTTP_PORT:-9200}:9200"
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data}/elasticsearch_docker
        target: /usr/share/elasticsearch/data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [dokandar_es_net]
networks:
  dokandar_es_net:
    name: dokandar_es_net
