# DOKANDAR utility — MongoDB 7.0 · Docker Compose single-node.
# Data is a HOST BIND MOUNT (${DATA_ROOT}/mongodb_docker/{db,configdb}) → it SURVIVES `docker compose
# down -v` (only `setup.sh purge` deletes it). Auth is enabled by the image when MONGO_INITDB_ROOT_* is
# set on first init; setup.sh enforces/rotates the password afterwards on existing data.
name: dokandar_mongodb_single
services:
  mongo:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: dokandar_mongo_docker_single
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-dokandar}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env (or run setup.sh up)}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data}/mongodb_docker/db
        target: /data/db
        bind:
          create_host_path: true
      - type: bind
        source: ${DATA_ROOT:-/data}/mongodb_docker/configdb
        target: /data/configdb
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [dokandar_mongo_net]
networks:
  dokandar_mongo_net:
    name: dokandar_mongo_net
