# DOKANDAR utility — MongoDB · Docker Compose HA cluster · SHARDED CLUSTER (mongos + config-RS + 2 shards).
# Horizontal sharding + per-shard replication + read/write split:
#   config-RS (csrs)   : cfg1                 — stores cluster metadata (configsvr replica set)
#   shard 1 (rs-shard1): s1a (primary) + s1b — a replica set; one chunk-range of the sharded data
#   shard 2 (rs-shard2): s2a (primary) + s2b — a replica set; the other chunk-range
#   mongos             : the query router — the single client entry point (:27017)
# Writes route to the owning shard's PRIMARY; reads can target SECONDARIES via readPreference. keyFile
# internal auth on every component (generated by setup.sh). Per-component data are HOST bind mounts.
x-mongod: &mongod
  image: mongo:${MONGO_VERSION:-7.0}
  restart: always
  volumes: &kf
    - ${KEYFILE_HOST_PATH:-/data/mongodb_sharded/keyfile}:/etc/mongo-keyfile:ro

services:
  cfg1:
    <<: *mongod
    container_name: dokandar_mongo_cfg1
    hostname: cfg1
    command: ["mongod","--configsvr","--replSet","csrs","--keyFile","/etc/mongo-keyfile","--bind_ip_all","--port","27017"]
    volumes:
      - ${KEYFILE_HOST_PATH:-/data/mongodb_sharded/keyfile}:/etc/mongo-keyfile:ro
      - ${DATA_ROOT:-/data}/mongodb_sharded/cfg1:/data/db

  s1a:
    <<: *mongod
    container_name: dokandar_mongo_s1a
    hostname: s1a
    command: ["mongod","--shardsvr","--replSet","rs-shard1","--keyFile","/etc/mongo-keyfile","--bind_ip_all","--port","27017"]
    volumes:
      - ${KEYFILE_HOST_PATH:-/data/mongodb_sharded/keyfile}:/etc/mongo-keyfile:ro
      - ${DATA_ROOT:-/data}/mongodb_sharded/s1a:/data/db
  s1b:
    <<: *mongod
    container_name: dokandar_mongo_s1b
    hostname: s1b
    command: ["mongod","--shardsvr","--replSet","rs-shard1","--keyFile","/etc/mongo-keyfile","--bind_ip_all","--port","27017"]
    volumes:
      - ${KEYFILE_HOST_PATH:-/data/mongodb_sharded/keyfile}:/etc/mongo-keyfile:ro
      - ${DATA_ROOT:-/data}/mongodb_sharded/s1b:/data/db

  s2a:
    <<: *mongod
    container_name: dokandar_mongo_s2a
    hostname: s2a
    command: ["mongod","--shardsvr","--replSet","rs-shard2","--keyFile","/etc/mongo-keyfile","--bind_ip_all","--port","27017"]
    volumes:
      - ${KEYFILE_HOST_PATH:-/data/mongodb_sharded/keyfile}:/etc/mongo-keyfile:ro
      - ${DATA_ROOT:-/data}/mongodb_sharded/s2a:/data/db
  s2b:
    <<: *mongod
    container_name: dokandar_mongo_s2b
    hostname: s2b
    command: ["mongod","--shardsvr","--replSet","rs-shard2","--keyFile","/etc/mongo-keyfile","--bind_ip_all","--port","27017"]
    volumes:
      - ${KEYFILE_HOST_PATH:-/data/mongodb_sharded/keyfile}:/etc/mongo-keyfile:ro
      - ${DATA_ROOT:-/data}/mongodb_sharded/s2b:/data/db

  mongos:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: dokandar_mongo_mongos
    hostname: mongos
    restart: always
    depends_on: [cfg1, s1a, s2a]
    command: ["mongos","--configdb","csrs/cfg1:27017","--keyFile","/etc/mongo-keyfile","--bind_ip_all","--port","27017"]
    volumes:
      - ${KEYFILE_HOST_PATH:-/data/mongodb_sharded/keyfile}:/etc/mongo-keyfile:ro
    ports:
      - "${MONGOS_PORT:-27017}:27017"
