# DOKANDAR utility — Apache Kafka · Docker Compose single-node (KRaft) + Provectus kafka-ui.
# Design ported from the dokandar/utilities/components kafka/ reference (cp-kafka), on apache/kafka 4.x
# (DOKANDAR §8 pins 4.3; Confluent's cp-kafka tops out at Kafka 4.0, so this uses Apache's own 4.3 image).
# Three listeners (KRaft, no ZooKeeper):
#   PLAINTEXT      :29092 — clients ON the docker network (the UI) → kafka:29092
#   PLAINTEXT_HOST :9092  — clients OUTSIDE docker (host/native)    → ${KAFKA_EXTERNAL_HOST}:9092
#   CONTROLLER     :9093  — KRaft controller quorum (intra-cluster, not published)
# Data is a HOST bind mount (${DATA_ROOT}/kafka_docker) → survives `docker compose down -v`.
name: dokandar_kafka_single
services:
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.3.0}
    container_name: dokandar_kafka_docker_single
    hostname: kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?run setup.sh up - it generates the cluster id}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data}/kafka_docker
        target: /var/lib/kafka/data
        bind: { create_host_path: true }
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks: [dokandar_kafka_net]

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-provectuslabs/kafka-ui:v0.7.2}
    container_name: dokandar_kafka_ui
    hostname: kafka-ui
    restart: always
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: dokandar
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092     # the internal PLAINTEXT listener
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    networks: [dokandar_kafka_net]

networks:
  dokandar_kafka_net:
    name: dokandar_kafka_net
