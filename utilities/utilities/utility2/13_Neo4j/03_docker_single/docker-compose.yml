# Neo4j — Docker Compose single-node (Community). Data is a HOST BIND MOUNT (survives `down -v`).
# Credentials from .env (setup.sh writes them). Built-in Neo4j Browser on the HTTP port.
services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:2026.05.0}
    container_name: dokandar_neo4j_docker_single
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set in .env}
      NEO4J_server_default__listen__address: 0.0.0.0
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data}/neo4j_docker
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
