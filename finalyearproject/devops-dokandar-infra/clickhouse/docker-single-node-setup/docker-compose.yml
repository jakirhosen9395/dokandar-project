# ClickHouse 24.8 — single node, Docker Compose. Fast columnar OLAP database.
#
# HOW TO READ THIS FILE (Docker day 1):
#   environment: = the image creates the login user + password on first start, and
#                  DEFAULT_ACCESS_MANAGEMENT lets that user manage grants (so it can
#                  log in over the network).
#   ports:       = 8123 = HTTP interface (has a built-in /play SQL console in a browser!)
#                  9004 = native TCP interface (9000 belongs to RustFS on this server).
#   ulimits:     = ClickHouse wants many open files; we raise the limit.
#   healthcheck: = GET /ping returns "Ok." when ready.
# Every ${...} value comes from the .env file next to this compose file.

name: dki-clickhouse

services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CH_VERSION:-24.8.14.39}
    container_name: dki_clickhouse
    restart: unless-stopped
    # Give the process 30s to shut down CLEANLY on stop/restart (default 10s
    # SIGKILLs databases mid-write and causes 'unclean shutdown' recovery).
    stop_grace_period: 30s
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dki}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?empty password - run setup_env.sh first}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # ClickHouse's internal memory budget — keep it under mem_limit.
      CLICKHOUSE_MAX_SERVER_MEMORY_USAGE: ${CLICKHOUSE_MAX_MEMORY:-1200000000}
    # Cap BOTH the container RAM and ClickHouse's own budget (see .env).
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-1500m}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_TCP_PORT:-9004}:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data/dki}/clickhouse
        target: /var/lib/clickhouse
        bind: { create_host_path: true }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

networks:
  default:
    name: dki_clickhouse_net
