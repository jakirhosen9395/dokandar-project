# Elastic Observability stack (APM-only) — Elasticsearch + Kibana + APM Server.
# Ported from github.com/jakirhosen9395/elastic-apm-stack, sized for a shared 8GB host.
#
# HOW TO READ THIS FILE (Docker day 1):
#   THREE services that start in order (each waits for the previous to be healthy):
#     elasticsearch  = the data store (security ON — real passwords)        :9200
#     kibana         = the web UI you open in a browser                     :5601
#     apm-server     = the door your apps push traces/metrics through       :8200
#   depends_on + condition: service_healthy = "don't start me until X is ready".
#   Every ${...} value comes from the .env file next to this compose file.

name: dki-elastic-apm

services:
  elasticsearch:
    # Official Elastic image; xpack security is ON so every request needs auth.
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.2.0}
    container_name: dki_apm_es
    restart: unless-stopped
    # Give the process 30s to shut down CLEANLY on stop/restart (default 10s
    # SIGKILLs databases mid-write and causes 'unclean shutdown' recovery).
    stop_grace_period: 30s
    environment:
      - node.name=dki-es-01
      - cluster.name=dki-apm
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Explicit JVM heap (mandatory) — half of the mem_limit below.
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?run setup_env.sh first}
    # Cap the container's RAM (mandatory — keeps the 8GB host stable).
    mem_limit: ${ES_MEM_LIMIT:-1500m}
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "${ES_PORT:-9200}:9200"
    # Bind mount: the indices live on the host and survive `down -v`.
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data/dki}/elastic-apm/elasticsearch
        target: /usr/share/elasticsearch/data
        bind: { create_host_path: true }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  kibana:
    # The browser UI. It logs into ES as the built-in `kibana_system` user —
    # setup.sh sets that user's password right after ES becomes healthy.
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.2.0}
    container_name: dki_apm_kibana
    restart: unless-stopped
    # Give the process 30s to shut down CLEANLY on stop/restart (default 10s
    # SIGKILLs databases mid-write and causes 'unclean shutdown' recovery).
    stop_grace_period: 30s
    depends_on:
      elasticsearch: { condition: service_healthy }
    environment:
      - SERVER_HOST=0.0.0.0
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:?run setup_env.sh first}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:?run setup_env.sh first}
    mem_limit: ${KIBANA_MEM_LIMIT:-1g}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  apm-server:
    # The intake your instrumented apps (Node/Java/Python/Go agents) send data to.
    # Its config file sits next to this compose file and is mounted read-only.
    image: docker.elastic.co/apm/apm-server:${ELASTIC_VERSION:-9.2.0}
    container_name: dki_apm_server
    restart: unless-stopped
    # Give the process 30s to shut down CLEANLY on stop/restart (default 10s
    # SIGKILLs databases mid-write and causes 'unclean shutdown' recovery).
    stop_grace_period: 30s
    depends_on:
      elasticsearch: { condition: service_healthy }
      kibana: { condition: service_healthy }
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - APM_SECRET_TOKEN=${APM_SECRET_TOKEN:?run setup_env.sh first}
    mem_limit: ${APM_MEM_LIMIT:-300m}
    volumes:
      - ./apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    ports:
      - "${APM_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8200' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

networks:
  default:
    name: dki_elastic_apm_net
