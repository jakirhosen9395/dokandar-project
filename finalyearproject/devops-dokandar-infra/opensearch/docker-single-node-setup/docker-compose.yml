# OpenSearch 2.17 — single node, Docker Compose. A full-text search + analytics engine
# (an Elasticsearch fork). This teaching single-node runs with the security plugin OFF
# (no TLS/passwords) — the SAME config the DOKANDAR platform uses locally — so you can learn
# the search API with plain HTTP. (Turn security ON for anything real.)
#
# HOW TO READ THIS FILE (Docker day 1):
#   environment: discovery.type=single-node tells it not to look for cluster peers;
#                DISABLE_SECURITY_PLUGIN=true drops TLS/auth for easy local learning;
#                the JAVA_OPTS cap its heap so it fits a shared box.
#   ports:       host 9201 -> container 9200 = the REST API (curl / browser).
#                (host port MOVED to 9201: 9200 belongs to elastic-apm-stack ES
#                in the fleet-wide canonical port map — see ../../README.md)
#   ulimits:     search engines need a high mmap/file-descriptor limit.
# Every ${...} value comes from the .env file next to this compose file.

name: dki-opensearch

services:
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.17.1}
    container_name: dki_opensearch
    restart: unless-stopped
    # Give the process 30s to shut down CLEANLY on stop/restart (default 10s
    # SIGKILLs databases mid-write and causes 'unclean shutdown' recovery).
    stop_grace_period: 30s
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      # Explicit JVM heap (mandatory) — half the mem_limit below.
      - "OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    # Cap the container's RAM (heap + Lucene off-heap stay inside it).
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-1500m}
    ports:
      - "${OPENSEARCH_PORT:-9201}:9200"
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data/dki}/opensearch
        target: /usr/share/opensearch/data
        bind: { create_host_path: true }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  default:
    name: dki_opensearch_net
