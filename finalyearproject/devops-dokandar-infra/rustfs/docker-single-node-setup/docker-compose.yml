# RustFS — S3-compatible object storage, single node, Docker Compose.
#
# HOW TO READ THIS FILE (Docker day 1):
#   ONE service, TWO ports: 9000 = the S3 API (aws/mc clients), 9001 = a web console.
#   ACCESS_KEY/SECRET_KEY are S3-style credentials (like AWS access keys).
#   The container runs as uid 10001 — setup.sh chowns the bind mounts for it.
# Every ${...} value comes from the .env file next to this compose file.

name: dki-rustfs

services:
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.0-beta.8}
    container_name: dki_rustfs
    restart: unless-stopped
    # Give the process 30s to shut down CLEANLY on stop/restart (default 10s
    # SIGKILLs databases mid-write and causes 'unclean shutdown' recovery).
    stop_grace_period: 30s

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-dki}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?empty secret - run setup_env.sh first}
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_DIRECTORY: /logs

    # Cap the container's RAM (mandatory — host stability).
    mem_limit: ${RUSTFS_MEM_LIMIT:-512m}

    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"

    # Bind mounts: objects + logs live on the host (survive `down -v`).
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/data/dki}/rustfs/data
        target: /data
        bind: { create_host_path: true }
      - type: bind
        source: ${DATA_ROOT:-/data/dki}/rustfs/logs
        target: /logs
        bind: { create_host_path: true }

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  default:
    name: dki_rustfs_net
