# audit-log-svc pipeline — Context #13 Platform (append-only OHS audit sink, R6).
# Inherited governance (shared template — NEVER edited here) + Go build/test + integration + provenance image.
# Merge gate = green pipeline (EF §17.2, ADR-024). Trace: R6, ADR-024, W1.
include:
  - project: 'final-year-project3354127/dkd-platform-libs'
    ref: main
    file: '/ci/templates/governance.yml'

stages: [governance, build, test, package]

variables:
  GOFLAGS: "-mod=vendor"

# One pipeline per change: MR pipelines for MRs; a branch pipeline only on the default branch; plus tags.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Shared rules so every job runs (and is required) in MR + default-branch + tag pipelines. The inherited
# governance jobs carry no rules of their own; re-declaring them with these rules makes them execute in
# MR pipelines without editing the shared template.
.mr_protected_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

governance:required-files:
  rules:
    - !reference [.mr_protected_rules, rules]
governance:conventional-commit:
  rules:
    - !reference [.mr_protected_rules, rules]
governance:traceability:
  rules:
    - !reference [.mr_protected_rules, rules]
governance:semver:
  rules:
    - !reference [.mr_protected_rules, rules]

# MR title must be Conventional Commits — squash-merge uses the MR title as the commit subject.
governance:mr-title-conventional:
  stage: governance
  image: alpine:3.20
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      echo "MR title: $CI_MERGE_REQUEST_TITLE"
      echo "$CI_MERGE_REQUEST_TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|perf|build|revert)(\([a-z0-9._-]+\))?!?: .+' \
        && echo "governance:mr-title-conventional OK" \
        || { echo "MR title is not Conventional Commits"; exit 1; }

# Go vet + build + unit tests (vendored; hermetic — no module proxy needed).
go:build-test:
  stage: build
  image: golang:1.25
  needs: []
  rules:
    - !reference [.mr_protected_rules, rules]
  script:
    - go vet ./...
    - go build ./...
    - go test -race ./...

# Integration: real Postgres + Redpanda service containers (proves store WORM/dedup + the franz-go consumer).
test:integration:
  stage: test
  image: golang:1.25
  needs: [go:build-test]
  rules:
    - !reference [.mr_protected_rules, rules]
  services:
    - name: postgres:18
      alias: postgres
    - name: redpandadata/redpanda:v24.2.7
      alias: redpanda
      command:
        - redpanda
        - start
        - --overprovisioned
        - --smp=1
        - --memory=1G
        - --reserve-memory=0M
        - --node-id=0
        - --check=false
        - --kafka-addr=PLAINTEXT://0.0.0.0:9092
        - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
  variables:
    POSTGRES_DB: dkd_platform
    POSTGRES_USER: dokandar
    POSTGRES_PASSWORD: testpass
    DKD_TEST_DB_DSN: "postgres://dokandar:testpass@postgres:5432/dkd_platform?sslmode=disable"
    DKD_TEST_KAFKA_BROKERS: "redpanda:9092"
  before_script:
    - for i in $(seq 1 30); do (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1 && break; sleep 1; done
    - for i in $(seq 1 60); do (echo > /dev/tcp/redpanda/9092) >/dev/null 2>&1 && break; sleep 1; done
  script:
    - go test -race -tags integration ./internal/store/... ./internal/consumer/...

# Provenance image build on tag: single-source SHA/version/build-time via build-args (no in-image re-derive).
docker:build:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  script:
    - docker build
        --build-arg VERSION="$CI_COMMIT_TAG"
        --build-arg GIT_SHA="$CI_COMMIT_SHA"
        --build-arg BUILD_TIME="$BUILD_TIME"
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" .
    # Release protocol (tested == released): the tagged image is pushed so it can be pulled and
    # functionally re-verified (single-SHA + health + one R6 append) on the exact tagged commit.
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
