apiVersion: apps/v1
kind: Deployment
metadata: { name: logistics-svc, namespace: dkd-logistics, labels: { app: logistics-svc } }
spec:
  replicas: 2
  selector: { matchLabels: { app: logistics-svc } }
  template:
    metadata: { labels: { app: logistics-svc }, annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9090" } }
    spec:
      containers:
        - name: logistics-svc
          image: registry.gitlab.com/final-year-project3354127/logistics-svc:0.1.0
          ports: [{ name: http, containerPort: 8080 }, { name: metrics, containerPort: 9090 }]
          livenessProbe:  { httpGet: { path: /live,  port: http } }
          readinessProbe: { httpGet: { path: /ready, port: http } }
