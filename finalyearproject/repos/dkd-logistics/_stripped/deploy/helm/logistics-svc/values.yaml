replicaCount: 2
image:
  repository: registry.gitlab.com/final-year-project3354127/logistics-svc
  tag: "0.1.0"
  pullPolicy: IfNotPresent
service:
  port: 8080
  metricsPort: 9090
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
env:
  DKD_ENV: staging
  DKD_LOG_LEVEL: info
probes:
  liveness: /live
  readiness: /ready
  startup: /health
