[project]
name = "fraud-svc"
version = "0.1.0"
description = "DOKANDAR Context #10 Fraud, Risk & Enforcement — advisory scoring + four-eyes holds (R4)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    "confluent-kafka>=2.6",
    "pika>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8", "mypy>=1.13", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "pika.*"]
ignore_missing_imports = true

[tool.coverage.run]
omit = ["src/fraud/main.py", "src/fraud/relay.py", "src/fraud/consumer.py", "src/fraud/rabbit.py", "src/fraud/redisstore.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=fraud --cov-report=term --cov-fail-under=80"
