# =============================================================================
# DOKANDAR dev-infra — EXTENSION: canon-completing engines (data-stores.yaml) that the base
# compose lacks, plus the R1/R2 DEDICATED Postgres instances (Custody #3, Finance #8).
# Merge with the base:  docker compose -f compose.yaml -f compose.extra.yaml --profile core up -d
# Secrets come from .env.secrets (gen-secrets.sh + gen-secrets-extra.sh).
# =============================================================================

volumes:
  pg_custody_data:
  pg_finance_data:
  neo4j_data:
  timescale_data:
  clickhouse_data:
  mongo_data:

services:

  # ---- Custody event store (R1: sole provenance writer -> DEDICATED isolated instance) ----
  postgres-custody:
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: dokandar_postgres_custody
    profiles: [core, all]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dokandar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.secrets (run ./gen-secrets.sh)}
      POSTGRES_DB: dkd_custody
      PGDATA: /var/lib/postgresql/data/pgdata
    ports: ["${POSTGRES_CUSTODY_PORT:-5435}:5432"]
    volumes: ["pg_custody_data:/var/lib/postgresql/data"]
    networks: [dokandar_dev]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-dokandar}\" -d dkd_custody"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---- Finance ledger store (R2: physically isolated -> DEDICATED instance) ----
  postgres-finance:
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: dokandar_postgres_finance
    profiles: [core, all]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dokandar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.secrets (run ./gen-secrets.sh)}
      POSTGRES_DB: dkd_finance
      PGDATA: /var/lib/postgresql/data/pgdata
    ports: ["${POSTGRES_FINANCE_PORT:-5433}:5432"]
    volumes: ["pg_finance_data:/var/lib/postgresql/data"]
    networks: [dokandar_dev]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-dokandar}\" -d dkd_finance"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---- Neo4j (ctx-4 Provenance Graph & Recall — graph store) ----
  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.26-community}
    container_name: dokandar_neo4j
    profiles: [core, all]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set in .env.secrets (run ./gen-secrets-extra.sh)}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["${NEO4J_HTTP_PORT:-7474}:7474", "${NEO4J_BOLT_PORT:-7687}:7687"]
    volumes: ["neo4j_data:/data"]
    networks: [dokandar_dev]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---- TimescaleDB (ctx-9 Logistics telemetry time-series) ----
  timescaledb:
    image: timescale/timescaledb:${TIMESCALE_IMAGE_TAG:-latest-pg17}
    container_name: dokandar_timescaledb
    profiles: [core, all]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dokandar}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:?set in .env.secrets (run ./gen-secrets-extra.sh)}
      POSTGRES_DB: dkd_logistics_telemetry
      PGDATA: /var/lib/postgresql/data/pgdata
    ports: ["${TIMESCALE_PORT:-5434}:5432"]
    volumes: ["timescale_data:/var/lib/postgresql/data"]
    networks: [dokandar_dev]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-dokandar}\" -d dkd_logistics_telemetry"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---- ClickHouse (ctx-12 Analytics OLAP; native port remapped — host 9000 belongs to RustFS) ----
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.8}
    container_name: dokandar_clickhouse
    profiles: [core, all]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${POSTGRES_USER:-dokandar}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env.secrets (run ./gen-secrets-extra.sh)}
      CLICKHOUSE_DB: dkd_analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ["${CLICKHOUSE_HTTP_PORT:-8123}:8123", "${CLICKHOUSE_NATIVE_PORT:-9004}:9000"]
    volumes: ["clickhouse_data:/var/lib/clickhouse"]
    networks: [dokandar_dev]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---- MongoDB (ctx-2/6/10 candidate read-model engine — unreconciled variant, now available) ----
  mongodb:
    image: mongo:${MONGO_VERSION:-8}
    container_name: dokandar_mongodb
    profiles: [core, all]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${POSTGRES_USER:-dokandar}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set in .env.secrets (run ./gen-secrets-extra.sh)}
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes: ["mongo_data:/data/db"]
    networks: [dokandar_dev]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
