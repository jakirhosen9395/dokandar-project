      - { topic: finance.escrow.EscrowReleased.v1, producer: 8, key: ESC, consumers: [7,11,12] }
      - { topic: finance.escrow.SettlementHoldReleased.v1, producer: 8, key: ESC, consumers: [11,12] }
      - { topic: finance.escrow.EscrowReversed.v1, producer: 8, key: ESC, consumers: [6,11,12] }
      # --- Logistics (#9) ---
      - { topic: logistics.shipment.ShipmentCreated.v1, producer: 9, key: SHP, consumers: [6,12] }
      - { topic: logistics.shipment.RiderAssigned.v1, producer: 9, key: SHP, consumers: [6,12] }
      - { topic: logistics.shipment.PickupRecorded.v1, producer: 9, key: SHP, consumers: [12] }
      - { topic: logistics.shipment.DeliveryRecorded.v1, producer: 9, key: SHP, consumers: [6,8,12] }
      - { topic: logistics.shipment.ShipmentCancelled.v1, producer: 9, key: SHP, consumers: [6,8,12] }
      - { topic: logistics.shipment.DeliveryFailed.v1, producer: 9, key: SHP, consumers: [6,12] }
      # --- Fraud (#10) ---
      - { topic: fraud.enforcement.FraudSignalRaised.v1, producer: 10, key: DID, consumers: [11,12] }
      - { topic: fraud.enforcement.AccountHeld.v1, producer: 10, key: DID, consumers: [6,7,8,11] }
      - { topic: fraud.enforcement.AccountHoldReleased.v1, producer: 10, key: DID, consumers: [6,7,8,11] }
      # --- Government (#11) ---
      - { topic: government.oversight.RecallDirectiveIssued.v1, producer: 11, key: recallId, consumers: [3] }
      - { topic: government.oversight.TradeFreezeDirective.v1, producer: 11, key: directiveId, consumers: [7] }
      - { topic: government.oversight.WalletFreezeDirective.v1, producer: 11, key: directiveId, consumers: [8] }
      # --- Platform scheduler (#13) ---
      - { topic: platform.scheduler.CoolingOffExpired.v1, producer: 13, key: ESC, consumers: [8] }
      - { topic: platform.scheduler.EscrowExpired.v1, producer: 13, key: ESC, consumers: [8] }
      - { topic: platform.scheduler.NILRollupRefresh.v1, producer: 13, key: GPID, consumers: [5] }

  rabbitmq:
    role: INTRA-CONTEXT only; NOT part of the Published Language (R6)
    golden_rule: "No queue crosses a context boundary (R6)."
    queues:
      - { queue: identity.kyc-verification, context: 1, messages: [KYCSubmitted.v1], purpose: "Async KYC review — NOT Kafka", pii: true }
      - { queue: identity.otp-dispatch, context: 1, messages: [OTP request], purpose: "OTP SMS dispatch", pii: true }
      - { queue: catalog.image-processing, context: 2, messages: [image job], purpose: "Image resize/compress" }
      - { queue: catalog.search-index, context: 2, messages: [index job], purpose: "OpenSearch index update" }
      - { queue: b2c.order-confirmation, context: 6, messages: [confirmation job], purpose: "Order confirmation notification" }
      - { queue: b2c.stock-reserve, context: 6, messages: [reserve job], purpose: "Async stock reservation" }
      - { queue: logistics.rider-assignment, context: 9, messages: [assignment job], purpose: "Rider matching" }
      - { queue: logistics.delivery-notification, context: 9, messages: [notification job], purpose: "Status notifications" }
      - { queue: fraud.hold-approval-request, context: 10, messages: [hold request], purpose: "Four-eyes second-approver queue (R4)" }
      - { queue: platform.notification-dispatch, context: 13, messages: [dispatch job], purpose: "Fan-out to SMS/email/push/USSD" }
