policy:
  subject_naming: "one registered schema subject per Kafka topic; subject == topic name (EF §8.4)"
  compatibility: "backward-compatible within a major version; additive-only changes (EF §8.4)"
  breaking_change: "a breaking change is a NEW .v(N+1) topic + dual-publish >=2 release cycles; never an in-place edit (R6; S-TOPIC)"
  payload_rule: "payloads carry canonical IDs only, never PII (R6); validated at the edge before entering the domain (EF C7)"
  format: "AsyncAPI 3 + JSON-Schema per event (DM aggregates are the source of truth)"
  rabbitmq: "RabbitMQ intra-context messages are NOT in this registry / Published Language (R6)"

