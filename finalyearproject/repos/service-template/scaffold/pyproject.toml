[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dkd-scaffold"
version = "0.1.0"
description = "DOKANDAR polyglot service scaffolder — one blueprint, five runtime emitters"
requires-python = ">=3.10"
license = {text = "Proprietary"}

[project.scripts]
dkd-scaffold = "dkdscaffold.cli:main"

[tool.setuptools.packages.find]
include = ["dkdscaffold*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
