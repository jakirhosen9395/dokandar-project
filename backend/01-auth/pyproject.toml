[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dokandar-auth"
version = "1.0.0"
description = "DOKANDAR Identity & Auth service — Python 3.13 / FastAPI"
requires-python = ">=3.12"
dependencies = [
    # NOTE: fastapi/starlette are PINNED. elastic-apm 6.26.x's Starlette
    # integration breaks on Starlette >= 0.42 (AttributeError on the newer
    # router types -> 500 on every request), while prometheus-fastapi-
    # instrumentator 8.x requires Starlette >= 1.0 — the two are mutually
    # exclusive. This trio (fastapi 0.115.6 -> starlette 0.41.3, instrumentator
    # 7.x) is the verified-compatible set on Python 3.14. Do not loosen without
    # re-testing /health under load.
    "fastapi==0.115.6",
    "starlette==0.41.3",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "aio-pika>=9.4",
    "confluent-kafka>=2.5",
    "pymongo>=4.8",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "prometheus-fastapi-instrumentator>=7.0,<8",   # 8.x requires Starlette>=1.0 (incompatible — see note above)
    "elastic-apm>=6.22",
    "python-json-logger>=2.0",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",  # alembic offline migrations use sync driver
    "grpcio>=1.66",          # gRPC server on :8001
    "grpcio-tools>=1.66",    # generate stubs at build/run time
    "protobuf>=5.28",
    "boto3>=1.35",           # KYC docs to RustFS via S3
]

[tool.setuptools.package-data]
"app" = ["grpc/*.proto"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]
