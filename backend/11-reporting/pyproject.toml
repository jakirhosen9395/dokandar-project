[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dokandar-reporting"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "starlette==0.41.3",
    "uvicorn[standard]>=0.30",
    "prometheus-fastapi-instrumentator>=7.0,<8.0",
    "pydantic>=2.9", "pydantic-settings>=2.6",
    "asyncpg>=0.30", "psycopg[binary]>=3.2",
    "aiokafka>=0.12",
    "httpx>=0.27", "pymongo>=4.10",
    "pyjwt[crypto]>=2.10", "elastic-apm>=6.22",
    "prometheus-client>=0.21",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
