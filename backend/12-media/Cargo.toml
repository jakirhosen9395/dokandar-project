[package]
name = "dokandar-media"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dokandar-media"
path = "src/main.rs"

[dependencies]
# --- web (Actix Web 4) ---
actix-web   = "4.11"
actix-rt    = "2"
tokio       = { version = "1", features = ["full"] }

# --- S3 presigning (MinIO / RustFS, S3 API, path-style) ---
aws-config  = { version = "1.8.18", features = ["behavior-version-latest"] }
aws-sdk-s3  = "1.137.0"

# --- gRPC server + Auth client (tonic 0.13 pairs with prost 0.13; build.rs uses tonic-build) ---
tonic       = "0.13"
prost       = "0.13"
subtle      = "2.6"            # constant-time x-internal-token compare (NEVER ==)

# --- RabbitMQ (media.thumbnail / media.av-scan + DLQ) ---
lapin       = "4.10"
async-trait = "0.1"

# --- persistence: runtime sqlx queries only (NO compile-time macros) ---
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# --- HTTP client (ES log sink + internal REST), rustls ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- forensic log sinks ---
mongodb = "3"
bson    = "2"

# --- Kafka transactional outbox relay ---
rdkafka = { version = "0.36", features = ["cmake-build"] }

# --- JWT verify-only (RS256) ---
jsonwebtoken = "9"

# --- OpenTelemetry → OTLP/HTTP → Elastic APM (0.27 stack, ported from 05-search) ---
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client"] }
opentelemetry-semantic-conventions = "0.27"

# --- metrics ---
prometheus = "0.13"

# --- serde / utility ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.22"
anyhow = "1"
thiserror = "2"
futures = "0.3"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
tonic-build = "0.13"

[profile.release]
opt-level = 2
debug = false
strip = true
