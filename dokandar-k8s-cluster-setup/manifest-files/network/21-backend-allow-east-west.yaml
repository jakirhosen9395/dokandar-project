# Backend services call each other via gRPC (:8001) and REST (:8000).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-east-west
  namespace: backend
  labels:
    environment: prod
    managed-by: gitlab-ci
    app.kubernetes.io/part-of: dokandar
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001
