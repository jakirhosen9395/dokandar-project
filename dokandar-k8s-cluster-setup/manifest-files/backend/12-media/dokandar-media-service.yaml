apiVersion: v1
kind: Service
metadata:
  name: dokandar-media
  namespace: backend
  labels:
    app: dokandar-media
    component: backend
    environment: prod
    managed-by: gitlab-ci
    app.kubernetes.io/part-of: dokandar
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: "/ready"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthcheck-healthy-threshold: "3"
    alb.ingress.kubernetes.io/healthcheck-unhealthy-threshold: "2"
spec:
  # NodePort: browsable over the VPN at http://<node-private-ip>:30012
  # (mirrors the old host convention 100NN -> 30000+NN)
  type: NodePort
  selector:
    app: dokandar-media
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8080
      nodePort: 30012
    - name: grpc
      protocol: TCP
      port: 8001
      targetPort: 50051
